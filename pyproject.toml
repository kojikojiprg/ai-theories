[project]
name = "ai-theories"
version = "0.1.0"
description = "LLM / VLM の理論学習と実践 / Learning LLM & VLM theory and building systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.28.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "sentencepiece>=0.2.2",
    "torch>=2.2",
    "torchvision>=0.28.0",
]

[build-system]
# src/ を `from src.layers import ...` の形のまま import できるパッケージとして install できるようにする。
# apps/ の各アプリは、このリポジトリをコミット固定の git 依存として持ち込む(CLAUDE.md の apps/ の節)。
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 配布するのは src/ だけ(theories/・apps/・scripts/ は含めない)。
packages = ["src"]

[dependency-groups]
# ローカルでノートブックを実行するための開発用依存(requirements.txt には含めない)。
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbstripout>=0.9.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true
